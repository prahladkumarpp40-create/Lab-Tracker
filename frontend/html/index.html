<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <form action="" method="post" id="login">

        <h1>STUDENT LOGIN</h1>

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Abcd@123(min 8 characters)"
            required
            pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
             title="Password  also Contains  this Pattern:-!@#$%^&"
        >

        <div class="lab-section">
            <label for="lab">Choose Your Lab</label>

            <select name="lab" id="lab" >
                <option value="" disabled selected>
                    -- Select Lab --
                </option>

                <option value="DSA">DSA</option>
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="Python">Python</option>
                <option value="OOPs">OOPs (Java)</option>
            </select>
        </div>

        <button type="submit" class="btn">
            Login
        </button>

        <p>
            Don't have an account?
            <a href="D:\Lab-Tracker\frontend\html\reg.html">Register</a>
        </p>

    </form>
    <script>
    document.getElementById("login").addEventListener("submit", function(event) {

        // Stop normal form submission
        event.preventDefault();

        const lab = document.getElementById("lab").value;

        if (lab === "") {
            window.location.href = "home.html";
            // <alert("Please select a lab");>
            return;
        }

        // Save selected lab
        localStorage.setItem("selectedLab", lab);

        if (lab === "Python") {
            window.location.href = "python.html";
        }

        else if (lab === "C") {
            window.location.href = "c.html";
        }

        else if (lab === "C++") {
            window.location.href = "cpp.html";
        }

        else if (lab === "DSA") {
            window.location.href = "dsa.html";
        }

        else if (lab === "OOPs") {
            window.location.href = "oops.html";
        }

    });
</script>

</body>

</html>
